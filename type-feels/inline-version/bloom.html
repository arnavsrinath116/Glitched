<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type Feels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,100..900,0..100;1,9..144,100..900,0..100&family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&family=UnifrakturMaguntia&display=swap">
  <style>
/* css/system.css */
/* ==========================================================================
   TYPE FEELS — design system
   Every size, gap and line-height is a multiple of the 8pt base unit.
   ========================================================================== */

:root {
  /* 8pt spacing scale */
  --u: 8px;
  --s1: 8px;  --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px;
  --s6: 48px; --s8: 64px; --s10: 80px; --s12: 96px; --s16: 128px;

  /* type scale — size / line-height, all on the 8pt grid */
  --t-cap: 16px;   --lh-cap: 24px;
  --t-body: 24px;  --lh-body: 32px;
  --t-h3: 32px;    --lh-h3: 40px;
  --t-h2: 48px;    --lh-h2: 56px;
  --t-h1: 96px;    --lh-h1: 96px;
  --t-mega: 192px; --lh-mega: 176px;

  --ui: "Space Grotesk", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, monospace;
  --flex: "Roboto Flex", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --black: "UnifrakturMaguntia", serif;

  --radius: 8px;
  --bar-h: 64px;
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* default theme (hub) — overridden per station */
  --bg: #0D0D0F;
  --fg: #F4F1EA;
  --accent: #FF5A1F;
  --muted: #8C8A86;
  --line: rgba(244, 241, 234, .16);
  --on-accent: #0D0D0F;
}

/* -------- station palettes: each pair is ≥ 7:1 contrast fg on bg -------- */
[data-theme="whisper"] { --bg:#0B0B10; --fg:#F4F1EA; --accent:#FF4D2E; --soft:#A9A4FF; --muted:#7D7A8C; --line:rgba(244,241,234,.14); --on-accent:#0B0B10; }
[data-theme="blackout"] { --bg:#1B1A17; --fg:#F3EEE3; --accent:#E5322D; --paper:#F3EEE3; --ink:#121212; --muted:#8A857A; --line:rgba(243,238,227,.16); --on-accent:#F3EEE3; }
[data-theme="rain"]    { --bg:#0A1030; --fg:#FFD23F; --accent:#3D7BFF; --muted:#8C93B8; --line:rgba(255,210,63,.14); --on-accent:#0A1030; }
[data-theme="face"]    { --bg:#161616; --fg:#F2F2F2; --accent:#FFC93C; --muted:#8E8E8E; --line:rgba(242,242,242,.14); --on-accent:#161616; }
[data-theme="words"]   { --bg:#101010; --fg:#F4F1EA; --accent:#7CFFB2; --muted:#8A8A8A; --line:rgba(244,241,234,.14); --on-accent:#101010; }
[data-theme="stretch"] { --bg:#0E0E0E; --fg:#D4FF3A; --accent:#FF3AF2; --muted:#7F8A5A; --line:rgba(212,255,58,.16); --on-accent:#0E0E0E; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--t-body)/var(--lh-body) var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---------------------------------------------------------------- shell */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  height: var(--bar-h);
  display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s4);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
}
.bar .num { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); color: var(--accent); }
.bar h1 { margin: 0; font: 600 var(--t-body)/var(--lh-body) var(--ui); letter-spacing: -.01em; }
.bar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s1);
  height: var(--s4); padding: 0 var(--s2);
  border: 1px solid var(--line); border-radius: var(--s2);
  font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .04em;
  color: var(--fg); background: transparent; white-space: nowrap;
}
.chip.live { border-color: var(--accent); color: var(--accent); }
.chip.live::before { content: ""; width: var(--s1); height: var(--s1); border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
.chip.warn { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--fg); }
@keyframes pulse { 50% { opacity: .25; } }

.stage { position: fixed; inset: var(--bar-h) 0 0 0; overflow: hidden; }
.stage.full { inset: 0; }

/* live gesture legend, centred in the top bar */
.bar .gestures { flex: 1; min-width: 0; display: flex; justify-content: safe center; gap: var(--s3); padding: 0 var(--s2); overflow: hidden; }
.gesture { display: inline-flex; align-items: center; gap: var(--s1); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); white-space: nowrap; color: var(--muted); transition: color .15s; }
.gesture b { font-size: var(--t-body); line-height: var(--lh-body); }
.gesture.on { color: var(--accent); }

/* "?" shortcuts popover, bottom-right */
.help { position: fixed; right: var(--s3); bottom: var(--s3); z-index: 30; }
.help-btn {
  width: var(--s6); height: var(--s6); border-radius: 50%;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px);
  font: 700 var(--t-body)/1 var(--mono); color: var(--fg); cursor: help;
  transition: background .2s, color .2s;
}
.help:hover .help-btn, .help.open .help-btn { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.help-pop {
  position: absolute; right: 0; bottom: calc(100% + var(--s1));
  min-width: calc(var(--s16) * 2.5); padding: var(--s2) var(--s3);
  border: 1px solid var(--line); border-radius: var(--s2);
  background: var(--bg); color: var(--fg); box-shadow: 0 var(--s2) var(--s6) rgba(0, 0, 0, .35);
  display: grid; gap: var(--s1);
  opacity: 0; visibility: hidden; transform: translateY(var(--s1));
  transition: opacity .2s var(--ease), transform .2s var(--ease), visibility .2s;
}
.help:hover .help-pop, .help:focus-within .help-pop, .help.open .help-pop { opacity: 1; visibility: visible; transform: none; }
.help-pop .eyebrow { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.help-pop .row { display: grid; grid-template-columns: var(--s10) 1fr; align-items: center; gap: var(--s2); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); white-space: nowrap; }
.help-pop .key { justify-self: start; }
.key {
  display: inline-grid; place-items: center; min-width: var(--s4); height: var(--s4); padding: 0 var(--s1);
  border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px;
  font: 700 12px/16px var(--mono);
}
.keys { display: flex; gap: var(--s2); align-items: center; font: 500 var(--t-cap)/var(--lh-cap) var(--ui); color: var(--muted); white-space: nowrap; }
.keys span { display: inline-flex; align-items: center; gap: var(--s1); }

/* --------------------------------------------------------------- intro */
.intro {
  position: fixed; inset: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--s3);
  align-content: center;
  padding: var(--s12) var(--s8);
  background: var(--bg);
  transition: opacity .5s var(--ease), visibility .5s;
}
.intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.intro .big-num {
  grid-column: 1 / span 4;
  font: 900 var(--t-mega)/var(--lh-mega) var(--flex);
  font-variation-settings: "wdth" 25, "wght" 1000, "opsz" 144;
  color: var(--accent);
  letter-spacing: -.04em;
}
.intro .body { grid-column: 5 / span 7; }
.intro .eyebrow { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.intro h2 { margin: var(--s1) 0 var(--s4); font: 700 var(--t-h1)/var(--lh-h1) var(--flex); font-variation-settings: "wdth" 80, "wght" 800, "opsz" 144; letter-spacing: -.03em; }
.intro ol { list-style: none; margin: 0 0 var(--s5); padding: 0; display: grid; gap: var(--s2); }
.intro li { display: grid; grid-template-columns: var(--s8) 1fr; align-items: center; gap: var(--s2); font: 400 var(--t-h3)/var(--lh-h3) var(--ui); }
.intro li .ico {
  width: var(--s8); height: var(--s8); display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: var(--s2); font-size: var(--t-h3);
}
.intro .actions { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.btn {
  height: var(--s8); padding: 0 var(--s5);
  border: 0; border-radius: var(--s4);
  background: var(--accent); color: var(--on-accent);
  font: 700 var(--t-body)/var(--lh-body) var(--ui);
  cursor: pointer; transition: transform .2s var(--ease);
}
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: .6; cursor: progress; transform: none; }
.intro .lesson { margin-top: var(--s6); padding-top: var(--s3); border-top: 1px solid var(--line); font: 400 var(--t-body)/var(--lh-body) var(--serif); font-style: italic; color: var(--fg); }
.intro .lesson b { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); font-style: normal; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-right: var(--s2); }
.intro .privacy { margin-top: var(--s2); font: 400 var(--t-cap)/var(--lh-cap) var(--ui); color: var(--muted); }
.intro .error { margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); }
.intro .error:empty { display: none; }

/* --------------------------------------------------------------- toast */
.toast {
  position: fixed; left: 50%; top: calc(var(--bar-h) + var(--s3)); z-index: 30;
  transform: translate(-50%, -16px); opacity: 0;
  padding: var(--s1) var(--s3); border-radius: var(--s3);
  background: var(--fg); color: var(--bg);
  font: 600 var(--t-cap)/var(--lh-cap) var(--ui);
  transition: .3s var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------- shared hand cursor layer */
canvas.hands { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

@media (max-width: 1100px) {
  .bar .gestures { visibility: hidden; }
  .intro { padding: var(--s8) var(--s4); }
  .intro .big-num { grid-column: 1 / -1; font-size: var(--t-h1); line-height: var(--lh-h1); }
  .intro .body { grid-column: 1 / -1; }
  .intro h2 { font-size: var(--t-h2); line-height: var(--lh-h2); }
  .intro li { font-size: var(--t-body); line-height: var(--lh-body); }
}

/* hidden field that receives typing on typing stations (see TF.textInput) */
.ghost-input { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; pointer-events: none; }
</style>
  <style>
/* css/bloom.css */
/* 03 · Bloom */
[data-theme="bloom"] { --bg:#000000; --fg:#F5F2EC; --accent:#FF2B1C; --muted:#8A8580; --line:rgba(245,242,236,.16); --on-accent:#000000; }

.garden { position: absolute; inset: 0; background: #000; overflow: hidden; transition: inset .35s var(--ease); }
.line {
  position: absolute; inset: var(--s12) var(--s8);
  display: flex; flex-wrap: wrap; justify-content: center; align-content: center; align-items: baseline;
  font-family: var(--serif); font-variation-settings: "wght" 450, "opsz" 144, "SOFT" 0;
  line-height: 1.05; color: var(--fg); letter-spacing: -.01em;
  isolation: isolate; /* lets vines sit behind the letters */
}
.lt { position: relative; display: inline-block; transition: opacity .9s .15s var(--ease); }
.lt.sp { width: .28em; }
.lt.wither { opacity: 0; }
.caret { width: .04em; height: .8em; margin-left: .04em; background: var(--fg); align-self: center; animation: pulse 1s steps(1) infinite; }
.placeholder {
  position: absolute; left: 0; right: 0; top: 50%; translate: 0 var(--s8); text-align: center;
  font: 400 var(--t-body)/var(--lh-body) var(--mono); color: var(--muted); opacity: 0; transition: opacity .4s; pointer-events: none;
}
.stage.empty .placeholder { opacity: 1; }

/* flora lives inside each letter, in em units: 100 svg units = 1em */
.flora { position: absolute; left: 50%; top: 50%; width: 4em; height: 4em; translate: -50% -50%; overflow: visible; pointer-events: none; transition: filter .8s, transform .9s var(--ease); }
.flora.back { z-index: -1; }
.flora.front { z-index: 2; }
.vine { fill: none; stroke: #2340FF; stroke-width: 2.6; stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.3, .6, .3, 1); }
.leaf { fill: #2340FF; transform-box: fill-box; transform-origin: 0% 50%; transform: scale(0); transition: transform .6s cubic-bezier(.2, 1.4, .4, 1); }
.bloom { transform: scale(0) rotate(-140deg); transition: transform 1.1s cubic-bezier(.2, 1.3, .3, 1); }
.flora.grown .leaf, .flora.grown .bloom { transform: none; }
.swirl { fill: none; stroke: #FFD6CC; stroke-width: 1.5; stroke-linecap: round; }
.lt.wither .flora { filter: grayscale(1) brightness(.45); transform: translateY(.3em) scale(.85); }

.sky { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
.wing { animation: flap .16s ease-in-out infinite alternate; }
.rest .wing { animation-duration: .9s; }
@keyframes flap { to { transform: scaleX(.25); } }

.modes, .export {
  position: absolute; top: var(--s3); right: var(--s3); z-index: 5;
  display: flex; padding: 4px; gap: 4px; border-radius: var(--s3);
  background: rgba(245, 242, 236, .08); border: 1px solid var(--line);
}
.modes button, .export button {
  height: var(--s4); padding: 0 var(--s2); border: 0; border-radius: var(--s2); background: transparent; cursor: pointer;
  font: 700 12px/16px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
}
.modes button.on { background: var(--fg); color: #000; }
.export { top: auto; bottom: var(--s3); right: calc(var(--s3) + var(--s6) + var(--s2)); opacity: 0; pointer-events: none; transition: opacity .3s; }
.export button { color: var(--fg); }
.export button:hover { background: var(--accent); color: #000; }

.meta {
  position: absolute; left: var(--s4); right: var(--s4); display: flex; justify-content: space-between;
  font: 700 12px/16px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  opacity: 0; transition: opacity .3s; z-index: 4;
}
.meta.top { top: var(--s3); }
.meta.bottom { bottom: var(--s3); }

/* poster mode: a 4:5 board with editorial furniture, ready to export */
[data-theme="bloom"] .stage.poster { background: #141414; }
.stage.poster .garden { inset: var(--s4) auto; left: 50%; height: calc(100% - var(--s8)); aspect-ratio: 4 / 5; translate: -50% 0; box-shadow: 0 var(--s3) var(--s8) rgba(0, 0, 0, .6); }
.stage.poster .line { inset: var(--s10) var(--s4); }
.stage.poster .meta, .stage.poster .export { opacity: 1; pointer-events: auto; }
.stage.poster .caret, .stage.poster .placeholder { display: none; }
</style>

<body>
  <script>
/* js/core.js */
/* ==========================================================================
   TYPE FEELS — shared core
   Station shell (intro, top bar, hint bar), laptop sensors (camera + mic),
   MediaPipe trackers and small helpers. Everything runs in the browser;
   nothing is recorded or uploaded.
   ========================================================================== */
(() => {
  'use strict';
  const TF = (window.TF = {});

  const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const MODELS = {
    hand: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
    face: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
    segment: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',
  };
  const SAVE_LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';

  /* ------------------------------------------------------------- math */
  TF.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  TF.lerp = (a, b, t) => a + (b - a) * t;
  TF.snap = (v, step = 8) => Math.round(v / step) * step;
  TF.rand = (a, b) => a + Math.random() * (b - a);
  TF.ease = (t) => 1 - Math.pow(1 - TF.clamp(t), 3);
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  TF.mix = (a, b, t) => {
    const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * TF.clamp(t))).join(',')})`;
  };
  TF.axes = (o) => Object.entries(o).map(([k, v]) => `"${k}" ${Math.round(v * 10) / 10}`).join(', ');

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  TF.el = el;

  /** Split text into one span per letter (spaces kept as non-breaking). */
  TF.letters = (host, text) => {
    host.textContent = '';
    return [...text].map((ch) => {
      const s = el('span', 'ch');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.display = 'inline-block';
      host.appendChild(s);
      return s;
    });
  };

  /** requestAnimationFrame loop: fn(dt seconds, t seconds). */
  TF.loop = (fn) => {
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      fn(dt, now / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  /** Size a canvas to its box at device resolution; returns the 2D context. */
  TF.fitCanvas = (canvas) => {
    const fit = () => {
      const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
      canvas.width = Math.round(r.width * d);
      canvas.height = Math.round(r.height * d);
      canvas.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    return canvas.getContext('2d');
  };

  /* ---------------------------------------------------------- sensors */
  let camPromise = null;
  TF.camera = (w = 1280, h = 720) =>
    (camPromise ||= (async () => {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: w }, height: { ideal: h }, facingMode: 'user' },
        audio: false,
      });
      const v = el('video');
      v.muted = true;
      v.playsInline = true;
      v.srcObject = stream;
      await v.play();
      TF.aspect = v.videoWidth / v.videoHeight || 16 / 9;
      return v;
    })().catch((e) => { camPromise = null; throw e; }));

  /**
   * Microphone, self-calibrating:
   *   value 0..1  loudness between the room's noise floor and the loudest recent sound
   *   hit   0..1  a sudden onset (clap, shout, stamp), decays quickly
   *   hits        counts every onset, so stations never miss one between frames
   *   tone  0..1  brightness of the sound (low hum → 0, hiss / clap → 1)
   * Laptop mics vary a lot, so loudness is relative to what this mic has heard,
   * and the floor never trusts the digital silence some drivers produce.
   */
  TF.mic = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const ctx = new AudioContext();
    await ctx.resume();
    const an = ctx.createAnalyser();
    an.fftSize = 2048;
    an.smoothingTimeConstant = 0.6;
    const src = ctx.createMediaStreamSource(stream);
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const freq = new Float32Array(an.frequencyBinCount);
    const binHz = ctx.sampleRate / an.fftSize;
    const m = { floor: -55, ref: -20, slow: -60, db: -90, raw: 0, value: 0, hit: 0, hits: 0, tone: 0.5, gain: 1 };
    let lastHit = 0;
    const onHit = (strength) => { m.hits++; m.hit = Math.max(m.hit, strength); };

    // Claps last ~10 ms, shorter than an animation frame, so onsets are found on
    // the audio thread every ~5 ms. A high-pass filter keeps voices from masking them.
    let onset = null;
    try {
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([ONSET_WORKLET], { type: 'application/javascript' })));
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1000;
      onset = new AudioWorkletNode(ctx, 'tf-onset');
      const mute = ctx.createGain();
      mute.gain.value = 0;
      src.connect(hp).connect(onset).connect(mute).connect(ctx.destination);
      onset.port.onmessage = (e) => onHit(e.data);
    } catch (e) {
      onset = null; // older browser: fall back to checking once per frame below
    }
    m.read = () => {
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      m.db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);

      // floor: drops quickly to quiet moments, creeps up in loud halls, never below -70 dB
      m.floor = Math.max(-70, m.floor + (m.db < m.floor ? 0.2 : 0.002) * (m.db - m.floor));
      // ref: loudest recent sound, slowly relaxing, at least 30 dB above the floor
      m.ref = m.db > m.ref ? m.ref + 0.3 * (m.db - m.ref) : m.ref - 0.004;
      m.ref = Math.max(m.ref, m.floor + 30);

      m.raw = TF.clamp((m.db - m.floor - 6) / ((m.ref - m.floor) * m.gain));
      m.value += (m.raw - m.value) * (m.raw > m.value ? 0.45 : 0.07);

      const now = performance.now();
      m.slow += (m.db - m.slow) * 0.05;
      m.hit *= 0.86;
      if (!onset && m.db - m.slow > 9 && m.db > m.floor + 16 && now - lastHit > 160) {
        onHit(TF.clamp((m.db - m.slow) / 24 + 0.3));
        lastHit = now;
      }

      an.getFloatFrequencyData(freq);
      let pw = 0, cw = 0;
      const top = Math.min(freq.length, Math.round(8000 / binHz));
      for (let i = 2; i < top; i++) { const p = Math.pow(10, freq[i] / 10); pw += p; cw += p * i * binHz; }
      if (pw > 0 && m.raw > 0.05) m.tone += (TF.clamp((cw / pw - 300) / 3500) - m.tone) * 0.15;
      return m.value;
    };
    m.sensitivity = () => Math.round(100 / m.gain);
    // gain > 1 = less sensitive: louder sounds needed, and a sharper rise to count as a clap
    m.setGain = (g) => {
      m.gain = TF.clamp(g, 0.4, 2.5);
      if (onset) onset.port.postMessage({ rise: 7 * m.gain });

    return m;

      constructor() {

      }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (!ch) return true;
        for (let i = 0; i < ch.length; i++) {
          this.acc += ch[i] * ch[i];
          if (++this.n < 240) continue;
          const db = 10 * Math.log10(this.acc / this.n + 1e-12);
          this.acc = 0; this.n = 0;
          this.floor = Math.max(-80, this.floor + (db < this.floor ? 0.05 : 0.0005) * (db - this.floor));
          const jump = db - this.slow;
          if (jump > this.rise && db > this.floor + 10 && currentTime - this.last > 0.1) {
            this.last = currentTime;
            this.port.postMessage(Math.min(1, 0.4 + (jump - this.rise) / 20));
          }
          // the average follows rises slowly (so a clap stands out) and falls fast (ready for the next)

    createTask('HandLandmarker', {
      baseOptions: { modelAssetPath: MODELS.hand },
      runningMode: 'VIDEO', numHands,
      minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,

    createTask('FaceLandmarker', {
      baseOptions: { modelAssetPath: MODELS.face },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,

    const n = f.filter(Boolean).length;

    ctx.save();
    ctx.strokeStyle = color;

    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    for (const lm of hands) {
      const p = lm.map((q) => TF.toScreen(q, rect, reach));
      ctx.beginPath();
      for (const [a, b] of BONES) { ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); }

  /**
   * Typing goes through a hidden text field that keeps focus. Browser extensions
   * with single-letter shortcuts (Vimium and friends) swallow keys on a plain page
   * but leave text fields alone, so every letter reaches the station.
   * onChar(ch) for each typed character, onKey('Backspace' | 'Enter').
   */
  TF.textInput = (onChar, onKey) => {
    const f = el('textarea', 'ghost-input');
    f.setAttribute('aria-label', 'Type here');
    f.setAttribute('autocomplete', 'off');
    f.setAttribute('autocapitalize', 'off');
    f.spellcheck = false;
    document.body.appendChild(f);
    const focus = () => {
      const a = document.activeElement;
      const typingElsewhere = a && a !== f && a.matches('input, textarea, [contenteditable]');
      if (document.body.classList.contains('started') && a !== f && !typingElsewhere) f.focus({ preventScroll: true });
    };
    f.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' || e.key === 'Enter') { e.preventDefault(); onKey(e.key); }
    });
    f.addEventListener('input', () => {
      for (const ch of f.value) onChar(ch);

    });

  };

  TF.typing = (initial, onChange, { max = 16, idle = 2500 } = {}) => {
    let word = initial, last = 0;
    const commit = (w) => { last = performance.now(); word = w.slice(0, max); onChange(word); };
    TF.textInput(
      (ch) => { if (/[\p{L}\p{N} !?'&.,-]/u.test(ch)) commit((performance.now() - last > idle ? '' : word) + ch); },
      (k) => { if (k === 'Backspace') commit(word.slice(0, -1)); },
    );

      <button class="help-btn" aria-label="Keyboard shortcuts">?</button>

        <div class="eyebrow">Shortcuts</div>

      </div>`);
    help.querySelector('.help-btn').onclick = () => help.classList.toggle('open');
    return help;
  };

  const friendly = (e) => {
    const n = e && e.name;
    if (n === 'NotAllowedError') return 'Permission was blocked. Click the camera/mic icon in the address bar, choose Allow, then press Start again.';
    if (n === 'NotFoundError') return 'No camera or microphone was found on this laptop.';
    if (n === 'NotReadableError') return 'The camera or mic is busy in another app or tab. Close it and try again.';
    return `Something went wrong: ${e && e.message ? e.message : e}. Check the internet connection (the tracking model loads from the web) and try again.`;
  };

  /**
   * Build a station page.
   * cfg: { theme, num, title, sensors, steps, lesson, privacy, gestures, keys, full, start(api) }
   */
  TF.station = (cfg) => {
    const body = document.body;
    body.dataset.theme = cfg.theme;
    document.title = `${cfg.num} ${cfg.title} · Type Feels`;

    const bar = el('header', 'bar', `
      <a class="chip" href="index.html">← All</a>
      <span class="num">${cfg.num}</span><h1>${cfg.title}</h1>
      <span class="gestures">${(cfg.gestures || []).map(([ico, label, id]) => `<span class="gesture" data-g="${id || ''}"><b>${ico}</b>${label}</span>`).join('')}</span>
      ${cfg.sensors.map((s) => `<span class="chip" data-sensor="${s}">${s}</span>`).join('')}

      <button class="chip" data-act="full">Fullscreen</button>`);

    const hint = TF.shortcuts([...(cfg.keys || []), ['Esc', 'All stations']]);
    const intro = el('section', 'intro', `
      <div class="big-num">${cfg.num}</div>
      <div class="body">
        <div class="eyebrow">Type Feels · ${cfg.sensors.join(' + ')}</div>
        <h2>${cfg.title}</h2>
        <ol>${cfg.steps.map(([ico, t]) => `<li><span class="ico">${ico}</span><span>${t}</span></li>`).join('')}</ol>
        <div class="actions"><button class="btn" data-act="start">Start</button><span class="keys"><span class="key">Enter</span></span></div>
        <div class="error"></div>
        <div class="lesson"><b>Design note</b>${cfg.lesson}</div>
        <div class="privacy">${cfg.privacy || 'Everything happens on this laptop. Nothing is recorded or uploaded.'}</div>
      </div>`);
    const toastEl = el('div', 'toast');
    body.append(stage, bar, hint, intro, toastEl);

    let started = false, toastTimer = 0;
    const startBtn = intro.querySelector('[data-act="start"]');
    const errBox = intro.querySelector('.error');

    const api = {
      stage, hint,
      keys: {},
      toast(msg, ms = 2200) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
      },
      status(sensor, state, text) {
        const c = bar.querySelector(`[data-sensor="${sensor}"]`);
        if (!c) return;

      },
      gesture(id) {
        bar.querySelectorAll('.gesture').forEach((g) => g.classList.toggle('on', g.dataset.g === id));
      },
      key(k, fn) { api.keys[k.toLowerCase()] = fn; },
      async save(node, name, format = 'png') {
        api.toast('Saving…');
        try {
          const lib = await loadSaveLib();
          let bg = getComputedStyle(node).backgroundColor;
          if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') bg = getComputedStyle(body).backgroundColor;
          const url = await (format === 'svg' ? lib.toSvg : lib.toPng)(node, { pixelRatio: 2, backgroundColor: bg });
          const a = el('a');
          a.href = url;
          a.download = `type-feels-${name}-${Date.now()}.${format}`;
          a.click();
          api.toast('Saved to Downloads ✓');
        } catch (e) {
          api.toast('Could not save. Press Win+Shift+S to screenshot instead.', 3500);
        }
      },
    };

    const showIntro = (on) => {
      intro.classList.toggle('gone', !on);
      if (started) startBtn.textContent = 'Back to it';
    };

    const start = async () => {
      if (started) return showIntro(false);
      startBtn.disabled = true;
      startBtn.textContent = 'Loading…';
      errBox.textContent = '';
      try {
        await cfg.start(api);
        started = true;
        body.classList.add('started');
        showIntro(false);
      } catch (e) {
        console.error(e);
        errBox.textContent = friendly(e);
        startBtn.textContent = 'Try again';
      }
      startBtn.disabled = false;
    };

    startBtn.onclick = start;
    bar.querySelector('[data-act="help"]').onclick = () => showIntro(true);
    bar.querySelector('[data-act="full"]').onclick = () =>
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (e.ctrlKey && k === 's') { e.preventDefault(); api.keys['save'] && api.keys['save'](); return; }
      if (k === 'escape') {
        if (started && !intro.classList.contains('gone')) showIntro(false);
        else location.href = 'index.html';
        return;
      }
      const introOpen = !intro.classList.contains('gone');
      if (introOpen) { if (k === 'enter') { e.preventDefault(); start(); } return; }
      if (!e.ctrlKey && !e.metaKey && api.keys[k]) { e.preventDefault(); api.keys[k](e); }
    });

    return api;
  };
})();

/* js/bloom.js */
/* 03 · BLOOM

(() => {

  const ATTRACT = ['let it grow', 'words are seeds', 'bloom', 'read, then grow', 'doubt is a seed'];

  const svgEl = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  // smooth curve through points (Catmull-Rom as cubic Béziers)
  const smooth = (p) => {
    let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++) {

      d += ` C${(p1.x + (p2.x - p0.x) / 6).toFixed(1)},${(p1.y + (p2.y - p0.y) / 6).toFixed(1)} ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)},${(p2.y - (p3.y - p1.y) / 6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;

    theme: 'bloom', num: '03', title: 'Bloom', sensors: ['Keyboard', 'Trackpad'],

    keys: [['Type', 'Grow letters'], ['Space', 'Cut'], ['⌫', 'Wither'], ['Enter', 'Clear'], ['Click', 'Call butterflies'], ['Tab', 'Type / Poster'], ['Ctrl S', 'Save PNG']],

  async function start({ stage, toast, gesture, key, save }) {

        <div class="meta top"><span>Type Feels</span><span>Bloom</span><span class="date"></span></div>
        <div class="line"><span class="caret"></span></div>
        <div class="placeholder">start typing…</div>
        <svg class="sky"></svg>
        <div class="meta bottom"><span>Design Club × Reading &amp; Writing Club</span><span class="count"></span></div>
      </div>
      <div class="modes"><button data-m="type" class="on">Type</button><button data-m="poster">Poster</button></div>
      <div class="export"><button data-f="png">PNG</button><button data-f="svg">SVG</button></div>`;
    const garden = stage.querySelector('.garden');

    const count = stage.querySelector('.count');

    let letters = [], roses = [], blooms = [], flies = [], petals = [], fontSize = 160, dirty = true;

    function fit() {

      for (let i = 0; i < segs; i++) {

        pts.push({ x: last.x + (Math.cos(ang) * len) / segs, y: last.y + (Math.sin(ang) * len) / segs });
      }
      const svg = back;
      const path = svgEl('path', { d: smooth(pts), class: 'vine' }, svg);

      path.style.strokeDasharray = L;
      path.style.strokeDashoffset = L;
      path.style.transitionDelay = delay + 's';

      let side = Math.random() < 0.5 ? 1 : -1;
      for (let s = rand(12, 20); s < L - 10; s += rand(20, 32)) {
        const p = path.getPointAtLength(s), q = path.getPointAtLength(s + 1);
        const deg = (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI;
        const g = svgEl('g', { transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${(deg + side * rand(40, 65)).toFixed(0)}) scale(${rand(0.6, 1.15).toFixed(2)})` }, svg);
        const leaf = svgEl('path', { d: 'M0 0 C6 -7 16 -7 24 0 C16 7 6 7 0 0Z', class: 'leaf' }, g);
        leaf.style.transitionDelay = (delay + grow * (s / L)).toFixed(2) + 's';
        side = -side;
      }
      const end = path.getPointAtLength(L);
      const size = rand(16, 30), here = { x: at.x + end.x, y: at.y + end.y, r: size };
      // no pile-ups: a rose only opens where there's room, otherwise a bud
      const room = blooms.every((b) => Math.hypot(b.x - here.x, b.y - here.y) > (b.r + here.r) * 1.15);
      if (room && Math.random() < 0.6 && roses.length < 4 + letters.length * 0.6) {
        rose(front, end, size, delay + grow * 0.85, owner);
        here.owner = owner;
        blooms.push(here);
      } else if (Math.random() < 0.6) {
        const g = svgEl('g', { transform: `translate(${end.x.toFixed(1)},${end.y.toFixed(1)})` }, svg);
        const b = svgEl('circle', { r: rand(3.5, 6).toFixed(1), fill: RED, class: 'bloom' }, g);
        b.style.transitionDelay = (delay + grow) + 's';
      }
    }

    function addLetter(ch) {
      if (ch === ' ') {
        const el = TF.el('span', 'lt sp');
        el.innerHTML = '&nbsp;';
        line.insertBefore(el, caret);
        letters.push({ el, roses: [], space: true });
        cut();
        fit();
        return;
      }
      const el = TF.el('span', 'lt');
      el.textContent = ch;
      // vines sit behind the letters, roses in front
      const back = svgEl('svg', { class: 'flora back', viewBox: '-200 -200 400 400' }, el);
      const front = svgEl('svg', { class: 'flora front', viewBox: '-200 -200 400 400' }, el);
      line.insertBefore(el, caret);
      const owner = { el, roses: [] };
      letters.push(owner);
      fit();
      const wU = (el.getBoundingClientRect().width / fontSize) * 100;
      const at = { x: ((el.offsetLeft + el.offsetWidth / 2) / fontSize) * 100, y: ((el.offsetTop + el.offsetHeight / 2) / fontSize) * 100 };
      // most letters get one vine; some none, a few two. Long phrases get sparser
      const r = Math.random();
      const vines = letters.length > 12 ? (r < 0.4 ? 0 : 1) : r < 0.15 ? 0 : r < 0.8 ? 1 : 2;
      for (let k = 0; k < vines; k++) vine(back, front, owner, wU, k, at);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        back.querySelectorAll('.vine').forEach((p) => { p.style.strokeDashoffset = 0; });
        back.classList.add('grown');
        front.classList.add('grown');
      }));
    }

    function forget(owner) { roses = roses.filter((r) => r.owner !== owner); blooms = blooms.filter((b) => b.owner !== owner); }

    function wither() {
      const owner = letters.pop();
      if (!owner) return;
      forget(owner);
      dropPetals(owner.roses, 3);
      owner.el.classList.add('wither');
      setTimeout(() => owner.el.remove(), 1000);
      fit();
    }

    function clearAll() {
      const all = letters;
      letters = [];
      dropPetals(roses, 2);
      roses = [];
      blooms = [];
      all.forEach((o, i) => setTimeout(() => o.el.classList.add('wither'), i * 40));
      setTimeout(() => all.forEach((o) => o.el.remove()), all.length * 40 + 1000);
      fit();
    }

    // space "cuts": the last word's roses shed a few petals
    function cut() {
      const word = [];
      for (let i = letters.length - 2; i >= 0 && !letters[i].space; i--) word.push(...letters[i].roses);
      dropPetals(word, 1);
    }

    /* ---- falling petals (screen space) */
    function dropPetals(list, each) {
      const g = garden.getBoundingClientRect();
      for (const R of list) {
        const b = R.pos.getBoundingClientRect();
        for (let i = 0; i < each; i++) {
          const el = svgEl('ellipse', { rx: rand(4, 8).toFixed(1), ry: rand(2, 4).toFixed(1), fill: RED }, sky);
          petals.push({ el, x: b.left - g.left + b.width / 2, y: b.top - g.top + b.height / 2, vx: rand(-40, 40), vy: rand(-60, 10), r: rand(0, 360), vr: rand(-200, 200), seed: rand(0, 9) });
        }
      }
    }

    /* ---- butterflies */
    function butterfly(tx, ty) {
      const g = garden.getBoundingClientRect();
      const fromLeft = Math.random() < 0.5;
      const el = svgEl('g', {}, sky);
      const wings = (flip) => {
        const outer = svgEl('g', flip ? { transform: 'scale(-1,1)' } : {}, el);
        const w = svgEl('g', { class: 'wing' }, outer);
        svgEl('path', { d: 'M0 -2 C-6 -20 -28 -26 -26 -8 C-25 2 -10 4 0 0Z', fill: BLUE }, w);
        svgEl('path', { d: 'M0 0 C-4 10 -18 20 -16 8 C-15 2 -7 0 0 0Z', fill: RED }, w);
        svgEl('circle', { cx: -16, cy: -12, r: 3, fill: '#F5F2EC' }, w);
        w.style.animationDelay = rand(0, 0.2) + 's';
      };
      wings(false);
      wings(true);
      svgEl('ellipse', { rx: 1.8, ry: 10, fill: '#F5F2EC' }, el);
      svgEl('path', { d: 'M0 -9 Q-3 -16 -6 -18 M0 -9 Q3 -16 6 -18', fill: 'none', stroke: '#F5F2EC', 'stroke-width': 1 }, el);
      flies.push({
        el, x: fromLeft ? -40 : g.width + 40, y: rand(0.1, 0.9) * g.height, vx: 0, vy: 0,
        tx, ty, mode: 'arrive', until: 0, born: performance.now() / 1000, seed: rand(0, 99), size: clamp(fontSize / 140, 0.7, 1.4),
      });
    }

    /* ---- input */
    const press = (k) => {
      lastKey = performance.now();
      // the self-written demo phrase makes way for the visitor's own words
      if (attract || demo) { clearInterval(attract); attract = null; demo = false; clearAll(); }
      if (k === 'Backspace') { wither(); gesture('back'); }
      else if (k === 'Enter') { clearAll(); gesture('enter'); }
      else if (k === ' ') { if (letters.length && !letters[letters.length - 1].space) addLetter(' '); gesture('space'); }
      else if (/\s/.test(k)) return;
      else if (letters.length < 40) { addLetter(k); gesture('type'); }
      else toast('The garden is full. Press Enter to clear it.');
    };
    TF.textInput(press, press);
    garden.addEventListener('pointermove', (e) => { const g = garden.getBoundingClientRect(); mouse = { x: e.clientX - g.left, y: e.clientY - g.top }; });
    garden.addEventListener('pointerleave', () => { mouse = { x: -9999, y: -9999 }; });
    garden.addEventListener('pointerdown', (e) => {
      const g = garden.getBoundingClientRect();
      if (flies.length < 10) { butterfly(e.clientX - g.left, e.clientY - g.top); butterfly(e.clientX - g.left, e.clientY - g.top); }
      gesture('click');
      lastKey = performance.now();
    });

    const setMode = (m) => {
      stage.classList.toggle('poster', m === 'poster');
      stage.querySelectorAll('.modes button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
      setTimeout(fit, 350);
    };
    stage.querySelector('.modes').addEventListener('click', (e) => { if (e.target.dataset.m) setMode(e.target.dataset.m); });
    stage.querySelector('.export').addEventListener('click', (e) => { if (e.target.dataset.f) save(garden, 'bloom', e.target.dataset.f); });
    key('tab', () => setMode(stage.classList.contains('poster') ? 'type' : 'poster'));
    key('save', () => save(garden, 'bloom'));
    addEventListener('resize', fit);

    // when nobody is playing, the garden writes to itself
    function autoType(text) {
      clearAll();
      demo = true;
      let i = 0;
      attract = setInterval(() => {
        if (i < text.length) addLetter(text[i++]);
        else { clearInterval(attract); attract = null; }
      }, 220);
    }

    await document.fonts.ready;
    fit();
    setTimeout(() => autoType(ATTRACT[0]), 400);
    let attractIdx = 1;

    TF.loop((dt, t) => {
      const g = garden.getBoundingClientRect();
      if (!attract && performance.now() - lastKey > 45000) { lastKey = performance.now(); autoType(ATTRACT[attractIdx++ % ATTRACT.length]); }

      // flowers lean and swell toward the cursor
      if (dirty || Math.floor(t * 60) % 20 === 0) {
        for (const R of roses) { const b = R.pos.getBoundingClientRect(); R.x = b.left - g.left + b.width / 2 - R.ox * (fontSize / 100); R.y = b.top - g.top + b.height / 2 - R.oy * (fontSize / 100); }
        dirty = false;
      }
      for (const R of roses) {
        const dx = mouse.x - R.x, dy = mouse.y - R.y, d = Math.hypot(dx, dy) || 1;
        const near = clamp(1 - d / 420);
        R.ox = lerp(R.ox, (dx / d) * near * 14, 0.12);
        R.oy = lerp(R.oy, (dy / d) * near * 14, 0.12);
        R.s = lerp(R.s, 1 + near * 0.3, 0.12);
        const sway = Math.sin(t * 1.3 + R.seed) * 4;
        R.head.setAttribute('transform', `translate(${R.ox.toFixed(2)},${R.oy.toFixed(2)}) scale(${R.s.toFixed(3)}) rotate(${(sway + near * 25).toFixed(1)})`);
      }

      // butterflies: arrive at the click, visit roses, perch, then leave
      const now = t;
      flies = flies.filter((F) => {
        if (F.mode === 'arrive' && Math.hypot(F.tx - F.x, F.ty - F.y) < 40) { F.mode = 'visit'; F.until = now + rand(0.8, 1.6); }
        if (F.mode === 'visit' && now > F.until) {
          if (roses.length && now - F.born < 25) { const R = roses[Math.floor(Math.random() * roses.length)]; F.rose = R; F.mode = 'toRose'; }
          else { F.mode = 'leave'; F.tx = F.x < g.width / 2 ? -80 : g.width + 80; F.ty = rand(-80, g.height * 0.3); }
        }
        if (F.mode === 'toRose') {
          F.tx = F.rose.x + F.rose.ox * (fontSize / 100); F.ty = F.rose.y + F.rose.oy * (fontSize / 100) - 6;
          if (!roses.includes(F.rose)) F.mode = 'visit';
          else if (Math.hypot(F.tx - F.x, F.ty - F.y) < 10) { F.mode = 'perch'; F.until = now + rand(2.5, 5); }
        }
        if (F.mode === 'perch') {
          F.x = lerp(F.x, F.tx, 0.2); F.y = lerp(F.y, F.ty, 0.2); F.vx *= 0.8; F.vy *= 0.8;
          if (now > F.until || !roses.includes(F.rose)) { F.mode = 'visit'; F.until = now; }
        } else {
          const dx = F.tx - F.x, dy = F.ty - F.y, d = Math.hypot(dx, dy) || 1, sp = F.mode === 'leave' ? 260 : 190;
          F.vx += ((dx / d) * sp - F.vx) * 0.05;
          F.vy += ((dy / d) * sp - F.vy) * 0.05 + Math.sin(now * 9 + F.seed) * 9;
          F.x += F.vx * dt; F.y += F.vy * dt;
        }
        const deg = (Math.atan2(F.vy, F.vx) * 180) / Math.PI + 90;
        F.el.classList.toggle('rest', F.mode === 'perch');
        F.el.setAttribute('transform', `translate(${F.x.toFixed(1)},${F.y.toFixed(1)}) rotate(${F.mode === 'perch' ? Math.sin(now * 2 + F.seed) * 10 : deg.toFixed(0)}) scale(${F.size.toFixed(2)})`);
        const gone = F.mode === 'leave' && (F.x < -60 || F.x > g.width + 60 || F.y < -60);
        if (gone) F.el.remove();
        return !gone;
      });

      petals = petals.filter((P) => {
        P.vy += 120 * dt; P.vx += Math.sin(now * 3 + P.seed) * 30 * dt;
        P.x += P.vx * dt; P.y += P.vy * dt; P.r += P.vr * dt;
        P.el.setAttribute('transform', `translate(${P.x.toFixed(1)},${P.y.toFixed(1)}) rotate(${P.r.toFixed(0)})`);
        if (P.y > g.height + 20) { P.el.remove(); return false; }
        return true;
      });
    });
  }
})();
</script>
</body>
</html>
