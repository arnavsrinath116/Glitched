<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type Feels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,100..900,0..100;1,9..144,100..900,0..100&family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&family=UnifrakturMaguntia&display=swap">
  <style>
/* css/system.css */
/* ==========================================================================
   TYPE FEELS — design system
   Every size, gap and line-height is a multiple of the 8pt base unit.
   ========================================================================== */

:root {
  /* 8pt spacing scale */
  --u: 8px;
  --s1: 8px;  --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px;
  --s6: 48px; --s8: 64px; --s10: 80px; --s12: 96px; --s16: 128px;

  /* type scale — size / line-height, all on the 8pt grid */
  --t-cap: 16px;   --lh-cap: 24px;
  --t-body: 24px;  --lh-body: 32px;
  --t-h3: 32px;    --lh-h3: 40px;
  --t-h2: 48px;    --lh-h2: 56px;
  --t-h1: 96px;    --lh-h1: 96px;
  --t-mega: 192px; --lh-mega: 176px;

  --ui: "Space Grotesk", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, monospace;
  --flex: "Roboto Flex", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --black: "UnifrakturMaguntia", serif;

  --radius: 8px;
  --bar-h: 64px;
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* default theme (hub) — overridden per station */
  --bg: #0D0D0F;
  --fg: #F4F1EA;
  --accent: #FF5A1F;
  --muted: #8C8A86;
  --line: rgba(244, 241, 234, .16);
  --on-accent: #0D0D0F;
}

/* -------- station palettes: each pair is ≥ 7:1 contrast fg on bg -------- */
[data-theme="whisper"] { --bg:#0B0B10; --fg:#F4F1EA; --accent:#FF4D2E; --soft:#A9A4FF; --muted:#7D7A8C; --line:rgba(244,241,234,.14); --on-accent:#0B0B10; }
[data-theme="blackout"] { --bg:#1B1A17; --fg:#F3EEE3; --accent:#E5322D; --paper:#F3EEE3; --ink:#121212; --muted:#8A857A; --line:rgba(243,238,227,.16); --on-accent:#F3EEE3; }
[data-theme="rain"]    { --bg:#0A1030; --fg:#FFD23F; --accent:#3D7BFF; --muted:#8C93B8; --line:rgba(255,210,63,.14); --on-accent:#0A1030; }
[data-theme="face"]    { --bg:#161616; --fg:#F2F2F2; --accent:#FFC93C; --muted:#8E8E8E; --line:rgba(242,242,242,.14); --on-accent:#161616; }
[data-theme="words"]   { --bg:#101010; --fg:#F4F1EA; --accent:#7CFFB2; --muted:#8A8A8A; --line:rgba(244,241,234,.14); --on-accent:#101010; }
[data-theme="stretch"] { --bg:#0E0E0E; --fg:#D4FF3A; --accent:#FF3AF2; --muted:#7F8A5A; --line:rgba(212,255,58,.16); --on-accent:#0E0E0E; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--t-body)/var(--lh-body) var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---------------------------------------------------------------- shell */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  height: var(--bar-h);
  display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s4);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
}
.bar .num { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); color: var(--accent); }
.bar h1 { margin: 0; font: 600 var(--t-body)/var(--lh-body) var(--ui); letter-spacing: -.01em; }
.bar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s1);
  height: var(--s4); padding: 0 var(--s2);
  border: 1px solid var(--line); border-radius: var(--s2);
  font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .04em;
  color: var(--fg); background: transparent; white-space: nowrap;
}
.chip.live { border-color: var(--accent); color: var(--accent); }
.chip.live::before { content: ""; width: var(--s1); height: var(--s1); border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
.chip.warn { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--fg); }
@keyframes pulse { 50% { opacity: .25; } }

.stage { position: fixed; inset: var(--bar-h) 0 0 0; overflow: hidden; }
.stage.full { inset: 0; }

/* live gesture legend, centred in the top bar */
.bar .gestures { flex: 1; min-width: 0; display: flex; justify-content: safe center; gap: var(--s3); padding: 0 var(--s2); overflow: hidden; }
.gesture { display: inline-flex; align-items: center; gap: var(--s1); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); white-space: nowrap; color: var(--muted); transition: color .15s; }
.gesture b { font-size: var(--t-body); line-height: var(--lh-body); }
.gesture.on { color: var(--accent); }

/* "?" shortcuts popover, bottom-right */
.help { position: fixed; right: var(--s3); bottom: var(--s3); z-index: 30; }
.help-btn {
  width: var(--s6); height: var(--s6); border-radius: 50%;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px);
  font: 700 var(--t-body)/1 var(--mono); color: var(--fg); cursor: help;
  transition: background .2s, color .2s;
}
.help:hover .help-btn, .help.open .help-btn { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.help-pop {
  position: absolute; right: 0; bottom: calc(100% + var(--s1));
  min-width: calc(var(--s16) * 2.5); padding: var(--s2) var(--s3);
  border: 1px solid var(--line); border-radius: var(--s2);
  background: var(--bg); color: var(--fg); box-shadow: 0 var(--s2) var(--s6) rgba(0, 0, 0, .35);
  display: grid; gap: var(--s1);
  opacity: 0; visibility: hidden; transform: translateY(var(--s1));
  transition: opacity .2s var(--ease), transform .2s var(--ease), visibility .2s;
}
.help:hover .help-pop, .help:focus-within .help-pop, .help.open .help-pop { opacity: 1; visibility: visible; transform: none; }
.help-pop .eyebrow { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.help-pop .row { display: grid; grid-template-columns: var(--s10) 1fr; align-items: center; gap: var(--s2); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); white-space: nowrap; }
.help-pop .key { justify-self: start; }
.key {
  display: inline-grid; place-items: center; min-width: var(--s4); height: var(--s4); padding: 0 var(--s1);
  border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px;
  font: 700 12px/16px var(--mono);
}
.keys { display: flex; gap: var(--s2); align-items: center; font: 500 var(--t-cap)/var(--lh-cap) var(--ui); color: var(--muted); white-space: nowrap; }
.keys span { display: inline-flex; align-items: center; gap: var(--s1); }

/* --------------------------------------------------------------- intro */
.intro {
  position: fixed; inset: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--s3);
  align-content: center;
  padding: var(--s12) var(--s8);
  background: var(--bg);
  transition: opacity .5s var(--ease), visibility .5s;
}
.intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.intro .big-num {
  grid-column: 1 / span 4;
  font: 900 var(--t-mega)/var(--lh-mega) var(--flex);
  font-variation-settings: "wdth" 25, "wght" 1000, "opsz" 144;
  color: var(--accent);
  letter-spacing: -.04em;
}
.intro .body { grid-column: 5 / span 7; }
.intro .eyebrow { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.intro h2 { margin: var(--s1) 0 var(--s4); font: 700 var(--t-h1)/var(--lh-h1) var(--flex); font-variation-settings: "wdth" 80, "wght" 800, "opsz" 144; letter-spacing: -.03em; }
.intro ol { list-style: none; margin: 0 0 var(--s5); padding: 0; display: grid; gap: var(--s2); }
.intro li { display: grid; grid-template-columns: var(--s8) 1fr; align-items: center; gap: var(--s2); font: 400 var(--t-h3)/var(--lh-h3) var(--ui); }
.intro li .ico {
  width: var(--s8); height: var(--s8); display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: var(--s2); font-size: var(--t-h3);
}
.intro .actions { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.btn {
  height: var(--s8); padding: 0 var(--s5);
  border: 0; border-radius: var(--s4);
  background: var(--accent); color: var(--on-accent);
  font: 700 var(--t-body)/var(--lh-body) var(--ui);
  cursor: pointer; transition: transform .2s var(--ease);
}
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: .6; cursor: progress; transform: none; }
.intro .lesson { margin-top: var(--s6); padding-top: var(--s3); border-top: 1px solid var(--line); font: 400 var(--t-body)/var(--lh-body) var(--serif); font-style: italic; color: var(--fg); }
.intro .lesson b { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); font-style: normal; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-right: var(--s2); }
.intro .privacy { margin-top: var(--s2); font: 400 var(--t-cap)/var(--lh-cap) var(--ui); color: var(--muted); }
.intro .error { margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font: 500 var(--t-cap)/var(--lh-cap) var(--ui); }
.intro .error:empty { display: none; }

/* --------------------------------------------------------------- toast */
.toast {
  position: fixed; left: 50%; top: calc(var(--bar-h) + var(--s3)); z-index: 30;
  transform: translate(-50%, -16px); opacity: 0;
  padding: var(--s1) var(--s3); border-radius: var(--s3);
  background: var(--fg); color: var(--bg);
  font: 600 var(--t-cap)/var(--lh-cap) var(--ui);
  transition: .3s var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------- shared hand cursor layer */
canvas.hands { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

@media (max-width: 1100px) {
  .bar .gestures { visibility: hidden; }
  .intro { padding: var(--s8) var(--s4); }
  .intro .big-num { grid-column: 1 / -1; font-size: var(--t-h1); line-height: var(--lh-h1); }
  .intro .body { grid-column: 1 / -1; }
  .intro h2 { font-size: var(--t-h2); line-height: var(--lh-h2); }
  .intro li { font-size: var(--t-body); line-height: var(--lh-body); }
}

/* hidden field that receives typing on typing stations (see TF.textInput) */
.ghost-input { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; pointer-events: none; }
</style>
  <style>
/* css/blackout.css */
/* 02 · Blackout Poetry */
.desk {
  position: absolute; inset: var(--s4) var(--s8);
  display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--s3);
  align-items: start; grid-template-rows: 100%;
}
.sheet {
  grid-column: 1 / span 8;
  padding: var(--s6) var(--s8);
  background: var(--paper); color: var(--ink);
  border-radius: 4px;
  box-shadow: 0 var(--s3) var(--s8) rgba(0, 0, 0, .45);
}
.src { margin-bottom: var(--s3); font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.src span { color: #8A857A; font-weight: 400; }
.page { font: 400 var(--size, 32px)/var(--lh, 48px) var(--serif); font-variation-settings: "opsz" 36; hyphens: none; }
.count { margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid rgba(18, 18, 18, .16); font: 700 var(--t-cap)/var(--lh-cap) var(--mono); color: #6E6A61; }

.w { position: relative; transition: color .4s var(--ease); }
.w::after {
  content: ""; position: absolute; inset: .12em -.16em .02em;
  background: var(--ink); border-radius: 2px;
  transform: scaleX(0) rotate(var(--r)); transform-origin: left center;
  transition: transform .22s var(--ease);
}
.w.out::after { transform: scaleX(1) rotate(var(--r)); }
.sheet.revealed .w:not(.out) { color: var(--accent); }
.sheet.revealed .src, .sheet.revealed .count { opacity: .4; }

.yours { grid-column: 9 / span 4; padding-top: var(--s2); color: var(--fg); }
.yours .eyebrow { font: 700 var(--t-cap)/var(--lh-cap) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: var(--s3); }
.poem-out p { margin: 0; font: 400 var(--t-h3)/var(--lh-h3) var(--serif); font-style: italic; }
.poem-out .placeholder { color: var(--muted); font-style: normal; font-size: var(--t-body); line-height: var(--lh-body); }
.poem-out[data-len="m"] p { font-size: var(--t-body); line-height: var(--lh-body); }
.poem-out[data-len="l"] p { font-size: 20px; line-height: var(--lh-body); }
.desk.revealed .poem-out p { font-weight: 600; }
.desk.revealed .poem-out[data-len="s"] p { font-size: var(--t-h2); line-height: var(--lh-h2); }
.yours { max-height: 100%; overflow: hidden; }

.pen {
  position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none;
  width: var(--s8); height: var(--s8); margin: calc(var(--s4) * -1) 0 0 calc(var(--s4) * -1);
  display: grid; place-items: center; font-size: var(--t-h3);
  border-radius: 50%; border: 3px solid var(--fg);
  background: conic-gradient(var(--accent) var(--p, 0deg), transparent 0);
  opacity: 0; transition: opacity .2s, border-color .2s;
}
.pen.show { opacity: 1; }
.pen[data-mode="point"] { border-color: var(--ink); width: var(--s3); height: var(--s3); margin: -12px 0 0 -12px; background: var(--ink); font-size: 0; }
.pen[data-mode="open"] { width: var(--s16); height: var(--s16); margin: -64px 0 0 -64px; border-style: dashed; border-color: var(--accent); background: rgba(229, 50, 45, .08); }
</style>

<body>
  <script>
/* js/core.js */
/* ==========================================================================
   TYPE FEELS — shared core
   Station shell (intro, top bar, hint bar), laptop sensors (camera + mic),
   MediaPipe trackers and small helpers. Everything runs in the browser;
   nothing is recorded or uploaded.
   ========================================================================== */
(() => {
  'use strict';
  const TF = (window.TF = {});

  const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const MODELS = {
    hand: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
    face: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
    segment: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',
  };
  const SAVE_LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';

  /* ------------------------------------------------------------- math */
  TF.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  TF.lerp = (a, b, t) => a + (b - a) * t;
  TF.snap = (v, step = 8) => Math.round(v / step) * step;
  TF.rand = (a, b) => a + Math.random() * (b - a);
  TF.ease = (t) => 1 - Math.pow(1 - TF.clamp(t), 3);
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  TF.mix = (a, b, t) => {
    const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * TF.clamp(t))).join(',')})`;
  };
  TF.axes = (o) => Object.entries(o).map(([k, v]) => `"${k}" ${Math.round(v * 10) / 10}`).join(', ');

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  TF.el = el;

  /** Split text into one span per letter (spaces kept as non-breaking). */
  TF.letters = (host, text) => {
    host.textContent = '';
    return [...text].map((ch) => {
      const s = el('span', 'ch');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.display = 'inline-block';
      host.appendChild(s);
      return s;
    });
  };

  /** requestAnimationFrame loop: fn(dt seconds, t seconds). */
  TF.loop = (fn) => {
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      fn(dt, now / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  /** Size a canvas to its box at device resolution; returns the 2D context. */
  TF.fitCanvas = (canvas) => {
    const fit = () => {
      const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
      canvas.width = Math.round(r.width * d);
      canvas.height = Math.round(r.height * d);
      canvas.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    return canvas.getContext('2d');
  };

  /* ---------------------------------------------------------- sensors */
  let camPromise = null;
  TF.camera = (w = 1280, h = 720) =>
    (camPromise ||= (async () => {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: w }, height: { ideal: h }, facingMode: 'user' },
        audio: false,
      });
      const v = el('video');
      v.muted = true;
      v.playsInline = true;
      v.srcObject = stream;
      await v.play();
      TF.aspect = v.videoWidth / v.videoHeight || 16 / 9;
      return v;
    })().catch((e) => { camPromise = null; throw e; }));

  /**
   * Microphone, self-calibrating:
   *   value 0..1  loudness between the room's noise floor and the loudest recent sound
   *   hit   0..1  a sudden onset (clap, shout, stamp), decays quickly
   *   hits        counts every onset, so stations never miss one between frames
   *   tone  0..1  brightness of the sound (low hum → 0, hiss / clap → 1)
   * Laptop mics vary a lot, so loudness is relative to what this mic has heard,
   * and the floor never trusts the digital silence some drivers produce.
   */
  TF.mic = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const ctx = new AudioContext();
    await ctx.resume();
    const an = ctx.createAnalyser();
    an.fftSize = 2048;
    an.smoothingTimeConstant = 0.6;
    const src = ctx.createMediaStreamSource(stream);
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const freq = new Float32Array(an.frequencyBinCount);
    const binHz = ctx.sampleRate / an.fftSize;
    const m = { floor: -55, ref: -20, slow: -60, db: -90, raw: 0, value: 0, hit: 0, hits: 0, tone: 0.5, gain: 1 };
    let lastHit = 0;
    const onHit = (strength) => { m.hits++; m.hit = Math.max(m.hit, strength); };

    // Claps last ~10 ms, shorter than an animation frame, so onsets are found on
    // the audio thread every ~5 ms. A high-pass filter keeps voices from masking them.
    let onset = null;
    try {
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([ONSET_WORKLET], { type: 'application/javascript' })));
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1000;
      onset = new AudioWorkletNode(ctx, 'tf-onset');
      const mute = ctx.createGain();
      mute.gain.value = 0;
      src.connect(hp).connect(onset).connect(mute).connect(ctx.destination);
      onset.port.onmessage = (e) => onHit(e.data);
    } catch (e) {
      onset = null; // older browser: fall back to checking once per frame below
    }
    m.read = () => {
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      m.db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);

      // floor: drops quickly to quiet moments, creeps up in loud halls, never below -70 dB
      m.floor = Math.max(-70, m.floor + (m.db < m.floor ? 0.2 : 0.002) * (m.db - m.floor));
      // ref: loudest recent sound, slowly relaxing, at least 30 dB above the floor
      m.ref = m.db > m.ref ? m.ref + 0.3 * (m.db - m.ref) : m.ref - 0.004;
      m.ref = Math.max(m.ref, m.floor + 30);

      m.raw = TF.clamp((m.db - m.floor - 6) / ((m.ref - m.floor) * m.gain));
      m.value += (m.raw - m.value) * (m.raw > m.value ? 0.45 : 0.07);

      const now = performance.now();
      m.slow += (m.db - m.slow) * 0.05;
      m.hit *= 0.86;
      if (!onset && m.db - m.slow > 9 && m.db > m.floor + 16 && now - lastHit > 160) {
        onHit(TF.clamp((m.db - m.slow) / 24 + 0.3));
        lastHit = now;
      }

      an.getFloatFrequencyData(freq);
      let pw = 0, cw = 0;
      const top = Math.min(freq.length, Math.round(8000 / binHz));
      for (let i = 2; i < top; i++) { const p = Math.pow(10, freq[i] / 10); pw += p; cw += p * i * binHz; }
      if (pw > 0 && m.raw > 0.05) m.tone += (TF.clamp((cw / pw - 300) / 3500) - m.tone) * 0.15;
      return m.value;
    };
    m.sensitivity = () => Math.round(100 / m.gain);
    // gain > 1 = less sensitive: louder sounds needed, and a sharper rise to count as a clap
    m.setGain = (g) => {
      m.gain = TF.clamp(g, 0.4, 2.5);
      if (onset) onset.port.postMessage({ rise: 7 * m.gain });
    };
    return m;
  };

  // Runs on the audio thread. Measures loudness in ~5 ms blocks and reports a hit
  // when a block jumps well above the recent average: a clap, a stamp, a shouted word.
  const ONSET_WORKLET = `
    class Onset extends AudioWorkletProcessor {
      constructor() {
        super();
        this.slow = -70; this.floor = -70; this.last = 0; this.rise = 7; this.acc = 0; this.n = 0;
        this.port.onmessage = (e) => { this.rise = e.data.rise; };
      }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (!ch) return true;
        for (let i = 0; i < ch.length; i++) {
          this.acc += ch[i] * ch[i];
          if (++this.n < 240) continue;
          const db = 10 * Math.log10(this.acc / this.n + 1e-12);
          this.acc = 0; this.n = 0;
          this.floor = Math.max(-80, this.floor + (db < this.floor ? 0.05 : 0.0005) * (db - this.floor));
          const jump = db - this.slow;
          if (jump > this.rise && db > this.floor + 10 && currentTime - this.last > 0.1) {
            this.last = currentTime;
            this.port.postMessage(Math.min(1, 0.4 + (jump - this.rise) / 20));
          }
          // the average follows rises slowly (so a clap stands out) and falls fast (ready for the next)
          this.slow += (db - this.slow) * (db > this.slow ? 0.03 : 0.12);
        }
        return true;
      }
    }
    registerProcessor('tf-onset', Onset);`;

  /* ------------------------------------------------------- MediaPipe */
  let visionPromise = null;
  const vision = () =>
    (visionPromise ||= (async () => {
      const mod = await import(`${VISION}/vision_bundle.mjs`);
      const fileset = await mod.FilesetResolver.forVisionTasks(`${VISION}/wasm`);
      return { mod, fileset };
    })().catch((e) => { visionPromise = null; throw e; }));

  async function createTask(kind, opts) {
    const { mod, fileset } = await vision();
    for (const delegate of ['GPU', 'CPU']) {
      try {
        return await mod[kind].createFromOptions(fileset, { ...opts, baseOptions: { ...opts.baseOptions, delegate } });
      } catch (e) {
        if (delegate === 'CPU') throw e;
      }
    }
  }
  TF.handTracker = (numHands = 2) =>
    createTask('HandLandmarker', {
      baseOptions: { modelAssetPath: MODELS.hand },
      runningMode: 'VIDEO', numHands,
      minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
  TF.faceTracker = () =>
    createTask('FaceLandmarker', {
      baseOptions: { modelAssetPath: MODELS.face },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
    });
  TF.segmenter = () =>
    createTask('ImageSegmenter', {
      baseOptions: { modelAssetPath: MODELS.segment },
      runningMode: 'VIDEO', outputConfidenceMasks: true, outputCategoryMask: false,
    });

  /** Run a task only when the webcam has a new frame; returns the latest result. */
  TF.tracker = (video, task) => {
    let lastTime = -1, result = null;
    return () => {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        result = task.detectForVideo(video, performance.now());
      }
      return result;
    };
  };

  /* ---------------------------------------------------------- hands */
  // landmark space is squashed by the camera's aspect ratio, so undo that
  const D = (a, b) => Math.hypot((a.x - b.x) * (TF.aspect || 16 / 9), a.y - b.y);
  TF.handDist = D;

  /** Mirror a landmark onto a screen rect. `reach` lets small arm moves cover the screen. */
  TF.toScreen = (p, rect, reach = 0.12) => ({
    x: rect.left + TF.clamp((1 - p.x - reach) / (1 - 2 * reach)) * rect.width,
    y: rect.top + TF.clamp((p.y - reach) / (1 - 2 * reach)) * rect.height,
  });

  /** Classify a hand: point ☝ · open ✋ · fist ✊ · thumb 👍 · other. */
  TF.pose = (lm) => {
    const palm = D(lm[0], lm[9]);
    const ext = (tip, pip) => D(lm[tip], lm[0]) > D(lm[pip], lm[0]) * 1.12;
    const f = [ext(8, 6), ext(12, 10), ext(16, 14), ext(20, 18)];
    const n = f.filter(Boolean).length;
    const thumbUp = lm[4].y < lm[6].y && lm[2].y - lm[4].y > palm * 0.55;
    let name = 'other';
    if (n === 0) name = thumbUp ? 'thumb' : 'fist';
    else if (f[0] && n === 1) name = 'point';
    else if (n >= 4) name = 'open';
    return { name, pinch: D(lm[4], lm[8]) / palm, palm };
  };

  /** Debounce a label so a pose must hold for a few frames before it counts. */
  TF.steady = (frames = 4) => {
    let cur = 'none', cand = 'none', count = 0;
    return (v) => {
      if (v === cand) count++;
      else { cand = v; count = 1; }
      if (count >= frames) cur = cand;
      return cur;
    };
  };

  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  /** Draw hands as a quiet skeleton so visitors can see what the camera sees. */
  TF.drawHands = (ctx, hands, rect, color, reach) => {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    for (const lm of hands) {
      const p = lm.map((q) => TF.toScreen(q, rect, reach));
      ctx.beginPath();
      for (const [a, b] of BONES) { ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); }
      ctx.stroke();
      for (const q of p) ctx.fillRect(q.x - 3, q.y - 3, 6, 6);
    }
    ctx.restore();
  };

  /* -------------------------------------------------------- keyboard */
  /**
   * Typing goes through a hidden text field that keeps focus. Browser extensions
   * with single-letter shortcuts (Vimium and friends) swallow keys on a plain page
   * but leave text fields alone, so every letter reaches the station.
   * onChar(ch) for each typed character, onKey('Backspace' | 'Enter').
   */
  TF.textInput = (onChar, onKey) => {
    const f = el('textarea', 'ghost-input');
    f.setAttribute('aria-label', 'Type here');
    f.setAttribute('autocomplete', 'off');
    f.setAttribute('autocapitalize', 'off');
    f.spellcheck = false;
    document.body.appendChild(f);
    const focus = () => {
      const a = document.activeElement;
      const typingElsewhere = a && a !== f && a.matches('input, textarea, [contenteditable]');
      if (document.body.classList.contains('started') && a !== f && !typingElsewhere) f.focus({ preventScroll: true });
    };
    f.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' || e.key === 'Enter') { e.preventDefault(); onKey(e.key); }
    });
    f.addEventListener('input', () => {
      for (const ch of f.value) onChar(ch);
      f.value = '';
    });
    f.addEventListener('blur', () => setTimeout(focus, 60));
    addEventListener('pointerup', () => setTimeout(focus, 0));
    setInterval(focus, 500);
    return { focus };
  };

  /** Live-typed word: typing after a pause starts a new word. */
  TF.typing = (initial, onChange, { max = 16, idle = 2500 } = {}) => {
    let word = initial, last = 0;
    const commit = (w) => { last = performance.now(); word = w.slice(0, max); onChange(word); };
    TF.textInput(
      (ch) => { if (/[\p{L}\p{N} !?'&.,-]/u.test(ch)) commit((performance.now() - last > idle ? '' : word) + ch); },
      (k) => { if (k === 'Backspace') commit(word.slice(0, -1)); },
    );
    return { get: () => word, set: (w) => { word = w; onChange(w); } };
  };

  /* ------------------------------------------------------------ save */
  let saveLib = null;
  const loadSaveLib = () =>
    (saveLib ||= new Promise((res, rej) => {
      const s = el('script');
      s.src = SAVE_LIB;
      s.onload = () => res(window.htmlToImage);
      s.onerror = rej;
      document.head.appendChild(s);
    }));

  /** The "?" in the bottom-right corner: hover (or tap) to see every shortcut. */
  TF.shortcuts = (keys) => {
    const help = el('div', 'help', `
      <button class="help-btn" aria-label="Keyboard shortcuts">?</button>
      <div class="help-pop" role="tooltip">
        <div class="eyebrow">Shortcuts</div>
        ${keys.map(([k, l]) => `<div class="row"><span class="key">${k}</span><span>${l}</span></div>`).join('')}
      </div>`);
    help.querySelector('.help-btn').onclick = () => help.classList.toggle('open');
    return help;
  };

  /* --------------------------------------------------- station shell */
  const friendly = (e) => {
    const n = e && e.name;
    if (n === 'NotAllowedError') return 'Permission was blocked. Click the camera/mic icon in the address bar, choose Allow, then press Start again.';
    if (n === 'NotFoundError') return 'No camera or microphone was found on this laptop.';
    if (n === 'NotReadableError') return 'The camera or mic is busy in another app or tab. Close it and try again.';
    return `Something went wrong: ${e && e.message ? e.message : e}. Check the internet connection (the tracking model loads from the web) and try again.`;
  };

  /**
   * Build a station page.
   * cfg: { theme, num, title, sensors, steps, lesson, privacy, gestures, keys, full, start(api) }
   */
  TF.station = (cfg) => {
    const body = document.body;
    body.dataset.theme = cfg.theme;
    document.title = `${cfg.num} ${cfg.title} · Type Feels`;

    const bar = el('header', 'bar', `
      <a class="chip" href="index.html">← All</a>
      <span class="num">${cfg.num}</span><h1>${cfg.title}</h1>
      <span class="gestures">${(cfg.gestures || []).map(([ico, label, id]) => `<span class="gesture" data-g="${id || ''}"><b>${ico}</b>${label}</span>`).join('')}</span>
      ${cfg.sensors.map((s) => `<span class="chip" data-sensor="${s}">${s}</span>`).join('')}
      <button class="chip" data-act="help">How to</button>
      <button class="chip" data-act="full">Fullscreen</button>`);
    const stage = el('main', 'stage' + (cfg.full ? ' full' : ''));
    const hint = TF.shortcuts([...(cfg.keys || []), ['Esc', 'All stations']]);
    const intro = el('section', 'intro', `
      <div class="big-num">${cfg.num}</div>
      <div class="body">
        <div class="eyebrow">Type Feels · ${cfg.sensors.join(' + ')}</div>
        <h2>${cfg.title}</h2>
        <ol>${cfg.steps.map(([ico, t]) => `<li><span class="ico">${ico}</span><span>${t}</span></li>`).join('')}</ol>
        <div class="actions"><button class="btn" data-act="start">Start</button><span class="keys"><span class="key">Enter</span></span></div>
        <div class="error"></div>
        <div class="lesson"><b>Design note</b>${cfg.lesson}</div>
        <div class="privacy">${cfg.privacy || 'Everything happens on this laptop. Nothing is recorded or uploaded.'}</div>
      </div>`);
    const toastEl = el('div', 'toast');
    body.append(stage, bar, hint, intro, toastEl);

    let started = false, toastTimer = 0;
    const startBtn = intro.querySelector('[data-act="start"]');
    const errBox = intro.querySelector('.error');

    const api = {
      stage, hint,
      keys: {},
      toast(msg, ms = 2200) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
      },
      status(sensor, state, text) {
        const c = bar.querySelector(`[data-sensor="${sensor}"]`);
        if (!c) return;
        c.className = 'chip' + (state ? ' ' + state : '');
        c.textContent = text || sensor;
      },
      gesture(id) {
        bar.querySelectorAll('.gesture').forEach((g) => g.classList.toggle('on', g.dataset.g === id));
      },
      key(k, fn) { api.keys[k.toLowerCase()] = fn; },
      async save(node, name, format = 'png') {
        api.toast('Saving…');
        try {
          const lib = await loadSaveLib();
          let bg = getComputedStyle(node).backgroundColor;
          if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') bg = getComputedStyle(body).backgroundColor;
          const url = await (format === 'svg' ? lib.toSvg : lib.toPng)(node, { pixelRatio: 2, backgroundColor: bg });
          const a = el('a');
          a.href = url;
          a.download = `type-feels-${name}-${Date.now()}.${format}`;
          a.click();
          api.toast('Saved to Downloads ✓');
        } catch (e) {
          api.toast('Could not save. Press Win+Shift+S to screenshot instead.', 3500);
        }
      },
    };

    const showIntro = (on) => {
      intro.classList.toggle('gone', !on);
      if (started) startBtn.textContent = 'Back to it';
    };

    const start = async () => {
      if (started) return showIntro(false);
      startBtn.disabled = true;
      startBtn.textContent = 'Loading…';
      errBox.textContent = '';
      try {
        await cfg.start(api);
        started = true;
        body.classList.add('started');
        showIntro(false);
      } catch (e) {
        console.error(e);
        errBox.textContent = friendly(e);
        startBtn.textContent = 'Try again';
      }
      startBtn.disabled = false;
    };

    startBtn.onclick = start;
    bar.querySelector('[data-act="help"]').onclick = () => showIntro(true);
    bar.querySelector('[data-act="full"]').onclick = () =>
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (e.ctrlKey && k === 's') { e.preventDefault(); api.keys['save'] && api.keys['save'](); return; }
      if (k === 'escape') {
        if (started && !intro.classList.contains('gone')) showIntro(false);
        else location.href = 'index.html';
        return;
      }
      const introOpen = !intro.classList.contains('gone');
      if (introOpen) { if (k === 'enter') { e.preventDefault(); start(); } return; }
      if (!e.ctrlKey && !e.metaKey && api.keys[k]) { e.preventDefault(); api.keys[k](e); }
    });

    return api;
  };
})();
</script>
  <script>
/* js/blackout.js */
/* 02 · BLACKOUT POETRY
   A page from a classic book. Point to black out words; whatever survives
   is your poem. Thumbs-up to reveal it, Ctrl+S to keep it. */
(() => {
  const { clamp, lerp } = TF;

  const PAGES = [
    { book: 'Alice’s Adventures in Wonderland', author: 'Lewis Carroll', year: 1865, text:
      'Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice, “without pictures or conversations?” So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.' },
    { book: 'A Tale of Two Cities', author: 'Charles Dickens', year: 1859, text:
      'It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity, it was the season of Light, it was the season of Darkness, it was the spring of hope, it was the winter of despair, we had everything before us, we had nothing before us, we were all going direct to Heaven, we were all going direct the other way. In short, the period was so far like the present period, that some of its noisiest authorities insisted on its being received, for good or for evil, in the superlative degree of comparison only.' },
    { book: 'Little Women', author: 'Louisa May Alcott', year: 1868, text:
      '“Christmas won’t be Christmas without any presents,” grumbled Jo, lying on the rug. “It’s so dreadful to be poor!” sighed Meg, looking down at her old dress. “I don’t think it’s fair for some girls to have plenty of pretty things, and other girls nothing at all,” added little Amy, with an injured sniff. “We’ve got Father and Mother, and each other,” said Beth contentedly from her corner. The four young faces on which the firelight shone brightened at the cheerful words, but darkened again as Jo said sadly, “We haven’t got Father, and shall not have him for a long time.”' },
    { book: 'Pride and Prejudice', author: 'Jane Austen', year: 1813, text:
      'It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife. However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters. “My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?” Mr. Bennet replied that he had not. “But it is,” returned she; “for Mrs. Long has just been here, and she told me all about it.”' },
  ];

  TF.station({
    theme: 'blackout', num: '02', title: 'Blackout Poetry', sensors: ['Camera'],
    steps: [
      ['☝️', 'Point one finger to black out a word, like a marker.'],
      ['✊', 'Make a fist to move without marking.'],
      ['✋', 'Open your palm to wipe marks away.'],
      ['👍', 'Hold a thumbs-up to reveal your poem.'],
    ],
    lesson: 'Poems are hiding inside every page. Taking words away is a way of writing.',
    gestures: [['☝️', 'mark', 'point'], ['✊', 'move', 'fist'], ['✋', 'wipe', 'open'], ['👍', 'reveal', 'thumb']],
    keys: [['Space', 'Reveal'], ['N', 'New page'], ['Del', 'Start over'], ['Ctrl S', 'Save']],
    start,
  });

  async function start({ stage, status, toast, gesture, key, save }) {
    stage.innerHTML = `
      <div class="desk">
        <article class="sheet"><header class="src"></header><div class="page"></div><footer class="count"></footer></article>
        <aside class="yours"><div class="eyebrow">Your poem</div><div class="poem-out"></div></aside>
      </div>
      <canvas class="hands"></canvas>
      <div class="pen"><span></span></div>`;
    const desk = stage.querySelector('.desk');
    const sheet = stage.querySelector('.sheet');
    const pageEl = stage.querySelector('.page');
    const out = stage.querySelector('.poem-out');
    const count = stage.querySelector('.count');
    const pen = stage.querySelector('.pen');
    const ctx = TF.fitCanvas(stage.querySelector('canvas'));

    let pageIdx = Math.floor(Math.random() * PAGES.length), words = [], rects = [], revealed = false;

    function loadPage(i) {
      pageIdx = (i + PAGES.length) % PAGES.length;
      const p = PAGES[pageIdx];
      sheet.querySelector('.src').innerHTML = `<span>From</span> ${p.book} <span>· ${p.author}, ${p.year}</span>`;
      pageEl.innerHTML = '';
      words = p.text.split(/\s+/).map((t) => {
        const w = TF.el('span', 'w');
        w.textContent = t;
        w.style.setProperty('--r', TF.rand(-1.2, 1.2).toFixed(2) + 'deg');
        pageEl.append(w, ' ');
        return w;
      });
      setReveal(false);
      fit();
      update();
    }

    // largest 8pt-friendly size that fits the sheet on screen
    function fit() {
      const avail = desk.clientHeight;
      for (const size of [48, 40, 32, 28, 24, 20]) {
        sheet.style.setProperty('--size', size + 'px');
        sheet.style.setProperty('--lh', Math.ceil((size * 1.45) / 8) * 8 + 'px');
        if (sheet.scrollHeight <= avail) break;
      }
      cache();
    }
    const cache = () => { rects = words.map((w) => w.getBoundingClientRect()); };

    function update() {
      const kept = words.filter((w) => !w.classList.contains('out')).map((w) => w.textContent);
      const marked = words.length - kept.length;
      count.textContent = `${kept.length} words kept · ${marked} blacked out`;
      if (!marked) { out.innerHTML = '<p class="placeholder">Black out words.<br>What’s left becomes your poem.</p>'; return; }
      // break lines at punctuation, or every five words
      const lines = [[]];
      kept.forEach((t) => {
        const clean = t.replace(/[“”"()]/g, '');
        lines[lines.length - 1].push(clean);
        if (/[.,;:!?—]$/.test(clean) || lines[lines.length - 1].length >= 5) lines.push([]);
      });
      out.innerHTML = lines.filter((l) => l.length).map((l) => `<p>${l.join(' ')}</p>`).join('');
      // short poems get set big; long ones step down the type scale so they fit
      out.dataset.len = kept.length <= 14 ? 's' : kept.length <= 32 ? 'm' : 'l';
    }

    function setReveal(on) {
      revealed = on;
      sheet.classList.toggle('revealed', on);
      desk.classList.toggle('revealed', on);
      if (on) toast('Your poem ✦ Ctrl+S to save · N for a new page');
    }

    function paint(x, y, mode) {
      if (revealed) return;
      let changed = false;
      const r = mode === 'wipe' ? 56 : 4;
      rects.forEach((b, i) => {
        const dx = Math.max(b.left - x, 0, x - b.right), dy = Math.max(b.top - y, 0, y - b.bottom);
        if (dx * dx + dy * dy > r * r) return;
        const w = words[i], isOut = w.classList.contains('out');
        if (mode === 'mark' && !isOut) { w.classList.add('out'); changed = true; }
        if (mode === 'wipe' && isOut) { w.classList.remove('out'); changed = true; }
      });
      if (changed) update();
    }
    // sample along the stroke so fast moves don't skip words
    let prev = null;
    function stroke(x, y, mode) {
      if (!prev || !mode) { prev = mode ? { x, y } : null; if (mode) paint(x, y, mode); return; }
      const steps = Math.max(1, Math.ceil(Math.hypot(x - prev.x, y - prev.y) / 8));
      for (let s = 1; s <= steps; s++) paint(lerp(prev.x, x, s / steps), lerp(prev.y, y, s / steps), mode);
      prev = { x, y };
    }

    /* ---- mouse / trackpad (also handy for testing) */
    let mouseMode = null;
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
    stage.addEventListener('pointerdown', (e) => { mouseMode = e.button === 2 || e.shiftKey ? 'wipe' : 'mark'; prev = null; stroke(e.clientX, e.clientY, mouseMode); });
    addEventListener('pointermove', (e) => { if (mouseMode) stroke(e.clientX, e.clientY, mouseMode); });
    addEventListener('pointerup', () => { mouseMode = null; prev = null; });

    key(' ', () => setReveal(!revealed));
    key('n', () => loadPage(pageIdx + 1));
    key('delete', () => { words.forEach((w) => w.classList.remove('out')); setReveal(false); update(); });
    key('save', () => save(desk, 'blackout-poem'));
    addEventListener('resize', () => setTimeout(fit, 50));

    await document.fonts.ready;
    loadPage(pageIdx);

    /* ---- hands */
    let track = null;
    try {
      const video = await TF.camera();
      track = TF.tracker(video, await TF.handTracker(1));
      status('Camera', 'live', 'Camera · hands');
    } catch (e) {
      status('Camera', 'warn', 'No camera · use mouse');
      toast(e && e.name === 'NotAllowedError' ? 'Camera is blocked: allow it in the address bar, then reload. Mouse works meanwhile.' : 'Hand tracking unavailable. Drag with the mouse to black out, right-drag to wipe.', 6000);
    }

    const steady = TF.steady(3);
    let cur = null, thumbHeld = 0;
    TF.loop((dt) => {
      const rect = stage.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      const res = track && track();
      const lm = res && res.landmarks && res.landmarks[0];
      if (!lm) {
        if (track) { pen.classList.remove('show'); gesture(''); steady('none'); prev = null; }
        return;
      }
      TF.drawHands(ctx, [lm], { left: 0, top: 0, width: rect.width, height: rect.height }, '#E5322D');
      const pose = steady(TF.pose(lm).name);
      const target = TF.toScreen(pose === 'open' ? lm[9] : lm[8], rect);
      cur = cur ? { x: lerp(cur.x, target.x, 0.5), y: lerp(cur.y, target.y, 0.5) } : target;

      const mode = pose === 'point' ? 'mark' : pose === 'open' ? 'wipe' : null;
      stroke(cur.x, cur.y, mode);
      gesture(pose);

      thumbHeld = pose === 'thumb' ? thumbHeld + dt : 0;
      if (thumbHeld >= 1) { setReveal(!revealed); thumbHeld = -1.5; }

      pen.classList.add('show');
      pen.dataset.mode = pose;
      pen.style.transform = `translate(${cur.x - rect.left}px, ${cur.y - rect.top}px)`;
      pen.style.setProperty('--p', clamp(thumbHeld) * 360 + 'deg');
      pen.firstChild.textContent = { point: '☝️', fist: '✊', open: '✋', thumb: '👍' }[pose] || '·';
    });
  }
})();
</script>
</body>
</html>
